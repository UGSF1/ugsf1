<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UGS F1 | Ukrainian Grand Series</title>

    <!-- Фавіконка сайту -->
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="logos/ugs-f1-logo.png" alt="UGS F1 Logo" class="header-logo">
        </div>

        <div class="subtitle">
            Ukrainian Grand Series
        </div>

        <div class="season">
            Season 1 ▼
        </div>

    </header>


    <nav class="menu">

        <a href="index.html" class="active">Home</a>
        <a href="teams.html">Teams</a>
        <a href="calendar.html">Calendar</a>
        <a href="standings.html">Standings</a>
        <a href="records.html">Record Board</a>

    </nav>


    <main>

        <!-- ВІДЕО-БЛОК З ЗВОРОТНИМ ВІДЛІКОМ (HERO BANNER) -->
        <section class="hero-container">
            <video class="hero-video" autoplay loop muted playsinline>
                <source src="video/race-loop.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <div class="hero-overlay"></div>

            <div class="hero-content">
                <div class="f1-header-badge">
                    <span class="f1-logo-text">UGS</span>
                    <span class="sub-badge">FORMULA 1 LEAGUE</span>
                </div>

                <div class="title-with-lines">
                    <div class="red-line"></div>
                    <h1 id="next-race-title" class="grand-prix-title">LOADING...</h1>
                    <div class="red-line"></div>
                </div>

                <!-- Динамічна зміна назви міста та року -->
                <p id="next-race-sub" class="race-dates"></p>

                <div class="countdown-inline">
                    <div class="time-item">
                        <span id="cd-days" class="number">00</span>
                        <span class="label">DAYS</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-item">
                        <span id="cd-hours" class="number">00</span>
                        <span class="label">HOURS</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-item">
                        <span id="cd-minutes" class="number">00</span>
                        <span class="label">MINUTES</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-item">
                        <span id="cd-seconds" class="number">00</span>
                        <span class="label">SECONDS</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="welcome-text">
            <h1>
                Welcome to UGS F1
            </h1>

            <p>
                Official website of Ukrainian Grand Series Championship
            </p>
        </section>

    </main>

    <!-- Правильне підключення даних та скриптів -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
